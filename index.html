<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    
    <!-- Metas de SEO y PWA -->
    <title>Estética Jos | Centro de Estética en Mérida, Venezuela</title>
    <meta name="description" content="Centro de estética integral en Mérida, Venezuela. Tratamientos faciales y corporales de vanguardia: Limpieza facial, Botox, Pink Glow, Masajes y más." />
    <meta name="theme-color" content="#81638b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Estética Jos" />

    <!-- Favicon e Íconos -->
    <link rel="icon" type="image/x-icon" href="/branding/icons/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/branding/icons/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/branding/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/branding/icons/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/branding/icons/apple-touch-icon.png" />

    <!-- Open Graph / Redes Sociales -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Estética Jos | Mérida, Venezuela" />
    <meta property="og:description" content="Tratamientos faciales y corporales de vanguardia con atención personalizada." />
    <meta property="og:image" content="/branding/logos/logo-circular.png" />
    <!-- Bloqueo preventivo de Netlify HUD / Badge -->
    <script>
      (function() {
        var observer = new MutationObserver(function(mutations) {
          for (var i = 0; i < mutations.length; i++) {
            var added = mutations[i].addedNodes;
            for (var j = 0; j < added.length; j++) {
              var node = added[j];
              if (node && node.nodeType === 1) {
                if (node.tagName === 'SCRIPT' && ((node.src && node.src.indexOf('hud') !== -1) || node.hasAttribute('data-nf-variant'))) {
                  node.remove ? node.remove() : node.parentNode && node.parentNode.removeChild(node);
                }
                if (node.id === 'nl-hud-frame' || node.id === 'nl-badge-frame' || (node.tagName === 'IFRAME' && node.id && node.id.indexOf('nl-') !== -1)) {
                  node.remove ? node.remove() : node.parentNode && node.parentNode.removeChild(node);
                }
              }
            }
          }
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>
  </head>
  <body>
    <!-- Señuelos anti-inicialización Netlify HUD -->
    <div id="nl-hud-frame" style="display:none!important;visibility:hidden!important;width:0!important;height:0!important;opacity:0!important;pointer-events:none!important;" aria-hidden="true"></div>
    <div id="nl-badge-frame" style="display:none!important;visibility:hidden!important;width:0!important;height:0!important;opacity:0!important;pointer-events:none!important;" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
